python:
- changed-files:
  - any-glob-to-any-file: 'src/**/*.py'

documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/*'
    - 'README.md'
    - 'LICENSE'
    - 'CODE_OF_CONDUCT.md'
    - 'CONTRIBUTING'

configs:
- changed-files:
  - any-glob-to-any-file:
    - './**/*.toml'
    - './**/*.yml'
    - './**/*.cfg'

container:
- changed-files:
  - any-glob-to-any-file: 'Dockerfile'
