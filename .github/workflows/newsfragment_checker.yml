name: newsfragment_checker

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: setup.py
      - run: pip install -e .[doc]

      - name: Check current "no changelog" label
        id: no-changelog
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO: "${{ github.repository }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          # github.event.pull_request.labels is a snapshot taken when this
          # run was dispatched. A label added by another workflow (e.g. the
          # Labeler's Dependabot job) after that moment would never show up
          # here, so query the PR's current labels instead of relying on
          # the (possibly stale) event payload.
          has_label=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | any(. == "no changelog")')
          echo "has_label=${has_label}" >> "$GITHUB_OUTPUT"

      - name: get added newsfragments
        if: steps.no-changelog.outputs.has_label != 'true'
        run: towncrier check --compare-with origin/main

      - name: Print result
        run: echo "Newsfragment added"
