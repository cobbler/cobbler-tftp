# This file is a reference for cobbler-tftp to validate all given configuration parameters against
schema: 1.0
auto_migrate_settings: false
# Run cobbler-tftp as a daemon in the background
is_daemon: true
pid_file_path: "/run/cobbler-tftp.pid"
# Specifications of the cobbler-server
cobbler:
  uri: "http://localhost/cobbler_api"
  username: "cobbler"
  password: "cobbler"
  # password_file: "/etc/cobbler-tftp/cobbler_password"
  # Time before requesting a new token, in seconds. To avoid problems, set
  # this to a lower value than the token expiration time.
  token_refresh_interval: 1800
# Chunk size (in bytes) used for fetching files from Cobbler over XML-RPC.
# Each chunk costs one XML-RPC round-trip to cobblerd, so lower values mean
# more round-trips and slower transfers of large files (kernels/initrds),
# while higher values trade a bit of memory per in-flight TFTP session for
# fewer round-trips. 65536 (64 KiB) comfortably covers the largest possible
# TFTP "blksize" a client can negotiate (65464 bytes per RFC 2348) - a value
# below the negotiated blksize causes the transfer to fail outright - while
# keeping a single chunk fetch fast enough to stay well under the default
# TFTP timeout below, even on a loaded cobblerd. Values far beyond this
# showed no further throughput benefit in testing and increase the risk of
# a single slow fetch exceeding the TFTP timeout under concurrent load.
prefetch_size: 65536
# TFTP server configuration
tftp:
  address: "127.0.0.1"
  port: 69
  retries: 5
  timeout: 2
  static_fallback_dir: "/srv/tftpboot"
logging_conf: "/etc/cobbler-tftp/logging.conf"
