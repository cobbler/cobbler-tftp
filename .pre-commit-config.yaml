repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    -   id: black
        args: ["--verbose", "--safe"]
        language_version: python3.11
        additional_dependencies: ['click==8.0.4']
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        args: ["--profile", "black", "--filter-files"]
